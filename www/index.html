<style>
/* Diseño: superficies redondeadas sobre un fondo con brillos suaves, acento índigo a violeta, cabecera de vidrio y píldoras de navegación. */
:root{
  --bg:#FFFFFF; --glow1:transparent; --glow2:transparent;
  --paper:#FFFFFF; --soft:#F4F5FA; --glass:rgba(255,255,255,.88); color-scheme:light;
  --ink:#12142B; --muted:#5D6280; --line:#E6E8F2;
  --accent:#5444E8; --accent-soft:rgba(84,68,232,.12); --on-accent:#FFFFFF;
  --btn1:#5B4CF0; --btn2:#8B5CF6;
  --good:#0B8A5F; --bad:#D9363E; --warn:#B45F06; --c2:#F59E0B;
  --m1:#5B4CF0; --m2:#0EA5A4; --m3:#E0568A; --m4:#E08A12; --m5:#2F7BE8; --m6:#7AA11A;
  --shadow:0 1px 2px rgba(18,20,43,.04),0 6px 18px -12px rgba(40,36,120,.14);
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:16px;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:radial-gradient(900px 480px at 8% -8%,var(--glow1),transparent 70%),radial-gradient(700px 420px at 100% 0%,var(--glow2),transparent 70%);
  background-repeat:no-repeat;
  color:var(--ink); font:400 15px/1.55 var(--body);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
a{color:var(--accent);text-underline-offset:2px}
.gut{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-top:12px;padding-bottom:8px}
.brandrow{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:62px;height:42px;flex:none;display:block;}
.eyebrow{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.top h1{font-size:clamp(22px,4.2vw,30px);font-weight:800;line-height:1;letter-spacing:-.02em}
.who{color:var(--muted);font-size:12.5px;margin-top:4px}
.sync{font:500 11.5px/1.2 var(--mono);display:flex;align-items:center;gap:7px;color:var(--muted);text-align:right;padding:6px 10px;border-radius:99px;background:var(--soft)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.on{color:var(--good)} .sync.on::before{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.sync.wait::before{background:var(--warn)}
.sync.off{color:var(--bad)} .sync.off::before{background:var(--bad)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
nav::-webkit-scrollbar,#subnav::-webkit-scrollbar{display:none}
nav a{flex:none;padding:8px 15px;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;border-radius:99px}
nav a:hover{color:var(--ink);background:var(--soft)}
nav a[aria-current="page"]{color:#fff;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 6px 16px -6px rgba(91,76,240,.6)}
.subwrap{border-top:1px solid var(--line)}
#subnav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px 0}
#subnav a{flex:none;padding:6px 12px;font:600 13px var(--body);color:var(--muted);text-decoration:none;border-radius:99px}
#subnav a:hover{color:var(--ink)}
#subnav a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

main{padding-block:22px 120px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:700;margin-bottom:12px}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{background:var(--accent-soft);border:1px solid transparent;border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--ink)}
.note.warn{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.err{color:var(--bad);font-size:13px}
.err:empty{display:none}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.ctxhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.ctxhead:empty{display:none}
.ctxhead h2{font-size:clamp(22px,3.6vw,30px);font-weight:800}

.tools{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px}
.tools:empty{display:none}
.tool{display:flex;flex-direction:column;gap:4px}
.tool label{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tool input,.tool select{width:auto;min-width:170px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font:600 13px var(--body);padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{resize:vertical;min-height:84px}
textarea.big{min-height:190px;font-size:16px;line-height:1.55}
.form h3{margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font:600 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.w2{grid-column:span 2}
.wfull{grid-column:1/-1}
@media (max-width:520px){.w2{grid-column:1/-1}}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{font:700 14px var(--body);padding:10px 18px;border-radius:12px;border:1px solid transparent;background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;cursor:pointer;min-height:42px;box-shadow:0 8px 18px -10px rgba(91,76,240,.8)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);background:var(--accent-soft)}
.lnk{background:none;border:0;color:var(--accent);font:600 13px var(--body);cursor:pointer;padding:4px 6px;border-radius:6px}
.lnk:hover{background:var(--accent-soft)}
.lnk.bad{color:var(--bad)}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
details ul{margin:8px 0 0;padding-left:20px}

.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:hover td{background:var(--soft)}
.tbl tr.grp td{background:var(--soft);font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.tbl th.num,.tbl td.num{text-align:right}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{white-space:nowrap;text-align:right}
.tfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding:14px 10px 0;font-size:14px}

.chip{display:inline-block;font:600 11px/1 var(--mono);padding:5px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.chip.info{color:var(--accent);background:var(--accent-soft)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.kpi:first-child{background:linear-gradient(135deg,var(--btn1),var(--btn2));border-color:transparent;color:#fff}
.kpi:first-child .k,.kpi:first-child .s{color:rgba(255,255,255,.82)}
.kpi:first-child .v.good,.kpi:first-child .v.bad{color:#fff}
.kpi .k{font:600 10.5px/1.25 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:800 clamp(21px,3.2vw,28px)/1.15 var(--display);margin-top:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.good{color:var(--good)} .bad{color:var(--bad)}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{width:100%;min-width:420px;height:auto;display:block}
.ct{fill:var(--muted);font:11px var(--mono)}
.ct.cur{fill:var(--ink);font-weight:600}
.gl{stroke:var(--line);stroke-width:1}
.b1{fill:var(--accent)} .b2{fill:var(--c2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:8px}
.sw{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;border-radius:3px}
.sw.b1{background:var(--accent)} .sw.b2{background:var(--c2)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:14px}
.bar-row .track{grid-column:1/-1;height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;background:linear-gradient(90deg,var(--c2),#F97316);border-radius:99px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .l{min-width:0;flex:1 1 160px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:4px 12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv>div{overflow-wrap:anywhere}
.empty{padding:36px 12px;text-align:center}
.empty .et{font:800 20px var(--display);margin-bottom:8px}
.empty p{color:var(--muted);max-width:52ch;margin:0 auto}
.steps{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.prog{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--btn1),var(--btn2));border-radius:99px}
.spark{width:120px;height:34px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.ficha{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:7px;min-width:0;box-shadow:var(--shadow)}
.ficha .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ficha .h strong{font:700 16px var(--display);overflow-wrap:anywhere}
.ficha .price{font:600 15px var(--mono);font-variant-numeric:tabular-nums}
.ficha .acts{text-align:left;margin-top:auto;padding-top:6px}
.ficha .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px;align-items:start}
.lane{background:var(--soft);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lane h3{font-size:14px;display:flex;justify-content:space-between;margin:2px 4px}
.lane h3 span{font:600 12px var(--mono);color:var(--muted)}
.lane .ficha{box-shadow:none}
.tmoves{display:flex;flex-wrap:wrap;gap:2px;align-items:center}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.entry:last-child{border-bottom:0}
.entry .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.day{font:600 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.ck{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.vres{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.vres h4{font:600 10.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
.vres ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.vres li.tk{list-style:none;margin-left:-20px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.vote[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

/* voz */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 14px 30px -10px rgba(91,76,240,.85),0 0 0 4px color-mix(in srgb,var(--paper) 70%,transparent);display:grid;place-items:center}
.fab:hover{filter:brightness(1.08)}
.fab[hidden]{display:none}
.fab svg,.micbtn svg{width:28px;height:28px}
.micstage{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}
.micbtn{width:92px;height:92px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--btn1),var(--btn2));display:grid;place-items:center;box-shadow:0 18px 36px -14px rgba(91,76,240,.9);position:relative}
.micbtn svg{width:38px;height:38px}
.micbtn.on{background:linear-gradient(135deg,#E5484D,#F97316)}
.micbtn.on::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid #E5484D;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.miclabel{font-weight:700;font-size:15px}
.micsub{max-width:46ch;text-align:center}
.vgrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.map-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--soft);padding:10px}
.map-wrap svg{display:block;min-width:620px;width:100%;height:auto}
.mt{fill:var(--ink);font:600 12px var(--body)}
.mt.c{fill:#fff;font:700 14px var(--display)}
.rels{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .stx{min-width:0;overflow-wrap:anywhere}
.tick{width:22px;height:22px;min-height:0;margin:2px 0 0;accent-color:var(--btn1);cursor:pointer;flex:none}
.okmark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--good);margin-top:1px}
.step.done strong{color:var(--muted);font-weight:600}
@media (max-width:520px){.step{grid-template-columns:auto minmax(0,1fr)}.step .acts{grid-column:2;text-align:left;white-space:normal}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:40;max-width:calc(100% - 100px);font-size:14px;box-shadow:var(--shadow)}
@media (max-width:600px){.who,.eyebrow{display:none}.logo{width:50px;height:34px}.top-in{padding-top:10px;padding-bottom:4px;flex-wrap:nowrap}.sync{font-size:10.5px;padding:5px 8px;max-width:48%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})};
var nf=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
var nf2=new Intl.NumberFormat('es-AR',{maximumFractionDigits:2});
var money=function(n,c){return (c==='USD'?'US$ ':'$ ')+nf.format(Math.round(n||0))};
var pad=function(n){return String(n).padStart(2,'0')};
var today=function(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var addMonths=function(ym,k){var p=ym.split('-').map(Number);var d=new Date(p[0],p[1]-1+k,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
var monthLabel=function(ym){var p=ym.split('-').map(Number);return new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(new Date(p[0],p[1]-1,1))};
var monthShort=function(ym){var p=ym.split('-').map(Number);return new Intl.DateTimeFormat('es-AR',{month:'short'}).format(new Date(p[0],p[1]-1,1)).replace('.','')};
var dateLabel=function(iso){return iso?String(iso).split('-').reverse().join('/'):''};
var short=function(n){return n>=1e6?nf2.format(n/1e6)+' M':n>=1e3?nf2.format(n/1e3)+' mil':String(Math.round(n))};
var norm=function(s){return String(s||'').trim().toLowerCase()};
var plain=function(s){return norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'')};
var byDateDesc=function(a,b){return (b.fecha||'').localeCompare(a.fecha||'')||(b.ts||0)-(a.ts||0)};
var lastDay=function(y,m){return new Date(y,m,0).getDate()};
var shiftDate=function(iso,k){var p=iso.split('-').map(Number);var q=addMonths(p[0]+'-'+pad(p[1]),k).split('-').map(Number);return q[0]+'-'+pad(q[1])+'-'+pad(Math.min(p[2],lastDay(q[0],q[1])))};
var daysTo=function(iso){return Math.round((Date.parse(iso+'T00:00:00')-Date.parse(today()+'T00:00:00'))/864e5)};
function plazo(iso){
  if(!iso)return '';var d=daysTo(iso);
  if(d<0)return '<span class="chip bad">Venció hace '+(-d)+(d===-1?' día':' días')+'</span>';
  if(d===0)return '<span class="chip bad">Vence hoy</span>';
  return '<span class="chip '+(d<=7?'warn':d<=30?'info':'')+'">Vence en '+d+(d===1?' día':' días')+'</span>';
}

function opts(f){var o=typeof f.o==='function'?f.o():f.o;return o.map(function(x){return Array.isArray(x)?x:[x,x]})}
function visibleFields(col){return SCH[col].fields.filter(function(f){return !(f.k==='emp'&&fixedEmp()!==undefined)})}

function fieldHTML(col,f,e){
  var id=col+'-'+f.k,v=e?(e[f.k]==null?'':e[f.k]):(f.def?f.def():'');
  var cls='fld '+(f.w==='full'?'wfull':f.w===2?'w2':''),inner;
  if(f.t==='select'){
    var o=opts(f);if(!e&&v==='')v=o[0][0];
    inner='<select id="'+id+'" name="'+f.k+'">'+o.map(function(p){return '<option value="'+esc(p[0])+'"'+(String(p[0])===String(v)?' selected':'')+'>'+esc(p[1])+'</option>'}).join('')+'</select>';
  }else if(f.t==='area'){
    inner='<textarea id="'+id+'" name="'+f.k+'" rows="3" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
  }else{
    var type=f.t||'text';
    var extra=type==='number'?' step="any" inputmode="decimal"'+(f.min!=null?' min="'+f.min+'"':'')+(f.max!=null?' max="'+f.max+'"':''):'';
    inner='<input id="'+id+'" name="'+f.k+'" type="'+type+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"'+extra+(f.list?' list="'+id+'-dl"':'')+(f.req?' required':'')+'>'+
      (f.list?'<datalist id="'+id+'-dl">'+f.list().map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist>':'');
  }
  return '<div class="'+cls+'"><label for="'+id+'">'+esc(f.l)+(f.req?' *':'')+'</label>'+inner+'</div>';
}
function renderForm(){
  var box=$('#formbox');if(!box)return;
  dirty=false;
  if(tab==='voz'){renderVozComposer();return}
  var col=editing?editing.col:current().col;
  if(!col||!db||tab==='resumen'){box.innerHTML='';return}
  if(!editing&&vozOpen&&col==='ideas'){renderVozComposer();return}
  if(readOnly){box.innerHTML='<p class="note">Tenés acceso de solo lectura. Pedile a quien creó la libreta que te comparta como editor para poder cargar datos.</p>';return}
  if(col==='hitos'&&!editing&&!formOpen){box.innerHTML=quickPasoHTML();return}
  var doc=isDocForm(col);
  if(!doc&&!editing&&!formOpen){box.innerHTML='';return}
  var sc=SCH[col],e=editing?editing.doc:(col==='cfg'?CFG:col==='ficha'?FICHA:null);
  var title=col==='cfg'?'Datos de la sociedad':col==='ficha'?'Ficha de la empresa':editing?'Editar '+sc.label:sc.add;
  box.innerHTML='<form class="card form" id="f-'+col+'" autocomplete="off" data-col="'+col+'"><h3>'+esc(title)+'</h3><div class="fgrid">'+
    visibleFields(col).map(function(f){return fieldHTML(col,f,e)}).join('')+'</div><p class="err" id="ferr" role="alert"></p><div class="frow"><button class="btn" type="submit">'+(doc?'Guardar':editing?'Guardar cambios':'Agregar')+'</button>'+
    (doc?'':'<button class="btn ghost" type="button" data-act="cancel">'+(editing?'Cancelar':'Cerrar')+'</button>')+'</div></form>';
}
function fail(m){var el=$('#ferr');if(el)el.textContent=m}
function saveMsg(e){return e&&e.code==='quota_exceeded'?'La base de datos llegó a su límite. Borrá registros viejos para seguir cargando.':e&&e.code==='invalid_argument'?'No se pudo guardar: no tenés permiso de edición o el registro ya no existe.':'No se pudo guardar. Revisá la conexión y probá de nuevo.'}
async function onSubmit(col,form){
  if(busy)return;fail('');
  var sc=SCH[col],vals={},fs=visibleFields(col);
  for(var i=0;i<fs.length;i++){
    var f=fs[i],v=form.elements[f.k].value.trim();
    if(f.t==='number'){v=v===''?null:Number(v);if(v!==null&&!isFinite(v))return fail('Revisá el campo '+f.l+'.')}
    if(f.req&&(v===''||v===null))return fail('Completá el campo '+f.l+'.');
    if(f.k==='link'&&v&&!/^https?:\/\//i.test(v))return fail('El enlace tiene que empezar con http:// o https://');
    vals[f.k]=v;
  }
  var btn=form.querySelector('button[type=submit]');busy=true;btn.disabled=true;
  try{
    if(sc.doc){
      if(col==='cfg'){if(vals.pctA==null)vals.pctA=50;if(vals.tc==null)vals.tc=0}
      if(col==='ficha'&&vals.saldo==null)vals.saldo=0;
      await db.doc(sc.doc).set(vals);toast('Guardado');
    }else if(editing&&editing.col===col){
      await db.collection(col).doc(editing.id).update(vals);toast('Cambios guardados');editing=null;formOpen=false;renderForm();renderTools();
    }else{
      var fe=fixedEmp();
      if(fe!==undefined&&sc.fields.some(function(f){return f.k==='emp'}))vals.emp=fe;
      vals.by=myId||null;vals.ts=Date.now();
      await db.collection(col).doc().set(vals);toast('Guardado');renderForm();
    }
  }catch(e){fail(saveMsg(e))}
  finally{busy=false;var b=document.querySelector('#formbox button[type=submit]');if(b)b.disabled=false}
}

/* ---------- nombres de personas ---------- */
function resolveNames(){
  if(!user)return Promise.resolve();
  var ids={};
  COLS.forEach(function(c){S[c].forEach(function(d){if(d.by)ids[d.by]=1;if(d.votos)Object.keys(d.votos).forEach(function(k){ids[k]=1})})});
  var list=Object.keys(ids);if(!list.length)return Promise.resolve();
  return user.profiles(list).then(function(ps){names=ps||{}}).catch(function(){});
}
var queued=false;
function schedule(){
  if(queued)return;queued=true;
  Promise.resolve().then(function(){return resolveNames()}).then(function(){queued=false;paint()});
}

/* ---------- gráfico y tablas de resumen ---------- */
function nice(v){if(v<=0)return 1000;var p=Math.pow(10,Math.floor(Math.log10(v)));var c=[1,2,4,6,8,10];for(var i=0;i<c.length;i++){if(c[i]*p>=v)return c[i]*p}return 10*p}
function chartBlock(emp){
  var ms=[];for(var i=5;i>=0;i--)ms.push(addMonths(month,-i));
  var data=ms.map(function(m){return {m:m,ing:sumA(sel('cobros',emp).filter(function(x){return cobrado(x)&&inMonth(x,m)})),gas:sumA(sel('gastos',emp).filter(function(x){return inMonth(x,m)}))}});
  var mx=nice(Math.max.apply(null,data.map(function(d){return Math.max(d.ing,d.gas)}).concat([0])));
  var W=640,H=230,L=56,R=10,T=14,B=30,iw=W-L-R,ih=H-T-B,gw=iw/ms.length,bw=Math.min(26,gw/2.6);
  var y=function(v){return T+ih-(v/mx)*ih};
  var s='<div class="chart-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ingresos cobrados y gastos de los últimos seis meses, en pesos">';
  [0,mx/2,mx].forEach(function(t){s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'"/><text class="ct" x="'+(L-8)+'" y="'+(y(t)+4)+'" text-anchor="end">'+short(t)+'</text>'});
  data.forEach(function(d,i){
    var cx=L+gw*i+gw/2,h1=ih*(d.ing/mx),h2=ih*(d.gas/mx);
    if(h1>0)s+='<rect class="b1" x="'+(cx-bw-1)+'" y="'+(T+ih-h1)+'" width="'+bw+'" height="'+h1+'"/>';

  });

var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
function syncMic(){
  var b=$('#micbtn');if(b){b.classList.toggle('on',voz.listening);b.setAttribute('aria-pressed',String(voz.listening))}
  var l=$('#miclabel');if(l)l.textContent=voz.listening?'Escuchando… tocá para parar':'Tocá para hablar';
}
function setTexto(t){voz.texto=t;var ta=$('#v-texto');if(ta){ta.value=t;ta.scrollTop=ta.scrollHeight}voz.err='';vozCount()}
function micStop(){if(rec){try{rec.onend=null;rec.onerror=null;rec.stop()}catch(e){}}rec=null;voz.listening=false;syncMic()}
function showHint(){var h=$('#v-hint');if(h){h.hidden=!voz.hint;h.textContent=voz.hint}}
function micFallback(msg){
  micStop();voz.hint=msg;showHint();
  var ta=$('#v-texto');if(ta&&ta.focus){ta.focus();try{ta.setSelectionRange(ta.value.length,ta.value.length)}catch(e){}}
}
var KB_MSG='Esta página no puede abrir el micrófono por su cuenta. Ya te dejé el cursor en el cuadro: tocá el micrófono del teclado del celular (o Windows+H, o fn dos veces en Mac) y hablá.';
function micStart(){
  if(voz.listening){micStop();return}
  if(!SR){micFallback(KB_MSG);return}
  try{
    var base=voz.texto,fin='';
    rec=new SR();rec.lang='es-AR';rec.continuous=true;rec.interimResults=true;
    rec.onresult=function(ev){
      var interim='';
      for(var i=ev.resultIndex;i<ev.results.length;i++){var r=ev.results[i];if(r.isFinal)fin+=r[0].transcript+' ';else interim+=r[0].transcript}
      setTexto((base+(base&&!/\s$/.test(base)?' ':'')+fin+interim).replace(/\s+$/,''));
    };
    rec.onerror=function(ev){
      var c=ev&&ev.error;
      if(c==='no-speech'||c==='aborted')return;
      micFallback(KB_MSG);
    };
    rec.onend=function(){
      if(!voz.listening)return;
      base=voz.texto;fin='';
      try{rec.start()}catch(e){micStop()}
    };
    rec.start();voz.listening=true;voz.hint='';showHint();syncMic();
  }catch(e){micFallback(KB_MSG)}
}

var mapN=0;
var cut=function(x){return String(x==null?'':x).trim().slice(0,80)};
function wrapT(str,n,max){
  var w=String(str).split(/\s+/),lines=[],cur='';
  w.forEach(function(x){if(cur&&(cur+' '+x).length>n){lines.push(cur);cur=x}else cur=cur?cur+' '+x:x});
  if(cur)lines.push(cur);
  if(lines.length>max){lines=lines.slice(0,max);lines[max-1]=lines[max-1].slice(0,n-1).replace(/\s+$/,'')+'…'}
  return lines;
}
function mapSVG(m){
  if(!m||!m.ramas||!m.ramas.length)return '';
  var id='mg'+(++mapN),PITCH=46,GAP=14,CW=160,BW=170,LW=200,X0=10,XB=X0+CW+70,XL=XB+BW+60,W=XL+LW+10;
  var blocks=[],y=10;
  m.ramas.forEach(function(r){var rows=Math.max(1,r.hijos.length),h=rows*PITCH;blocks.push({r:r,y:y,h:h});y+=h+GAP});
  var H=Math.max(y-GAP+10,100),cyc=H/2;
  var txt=function(lines,x,cy,anchor,cls,lh){
    var y0=cy-(lines.length-1)*lh/2+4.5;
    return lines.map(function(l,i){return '<text class="'+cls+'" x="'+x+'" y="'+(y0+i*lh)+'" text-anchor="'+anchor+'">'+esc(l)+'</text>'}).join('');
  };
  var out='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Mapa conceptual: '+esc(m.centro)+'"><defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--btn1)"/><stop offset="1" style="stop-color:var(--btn2)"/></linearGradient></defs>';
  var cl=wrapT(m.centro,16,4),chh=Math.max(54,cl.length*18+22);
  var paths='',nodes='';
  blocks.forEach(function(b,i){
    var col='var(--m'+((i%6)+1)+')',by=b.y+b.h/2;
    var bl2=wrapT(b.r.t,20,3),bh=Math.max(38,bl2.length*15+14);
    paths+='<path d="M'+(X0+CW)+' '+cyc+' C'+(X0+CW+35)+' '+cyc+' '+(XB-35)+' '+by+' '+XB+' '+by+'" fill="none" style="stroke:'+col+'" stroke-width="2.6" opacity=".75"/>';
    nodes+='<rect x="'+XB+'" y="'+(by-bh/2)+'" width="'+BW+'" height="'+bh+'" rx="12" style="fill:color-mix(in srgb,'+col+' 22%,var(--paper));stroke:'+col+'" stroke-width="1.6"/>'+txt(bl2,XB+12,by,'start','mt',15).replace(/class="mt"/g,'class="mt" style="font-weight:700"');
    b.r.hijos.forEach(function(h,j){
      var ly=b.y+j*PITCH+PITCH/2,hl=wrapT(h,28,2),hh=Math.max(32,hl.length*15+12);
      paths+='<path d="M'+(XB+BW)+' '+by+' C'+(XB+BW+30)+' '+by+' '+(XL-30)+' '+ly+' '+XL+' '+ly+'" fill="none" style="stroke:'+col+'" stroke-width="1.8" opacity=".6"/>';
      nodes+='<rect x="'+XL+'" y="'+(ly-hh/2)+'" width="'+LW+'" height="'+hh+'" rx="10" style="fill:color-mix(in srgb,'+col+' 9%,var(--paper));stroke:'+col+'" stroke-width="1.2"/>'+txt(hl,XL+10,ly,'start','mt',15).replace(/class="mt"/g,'class="mt" style="font-weight:500;font-size:11.5px"');
    });
  });
  out+=paths+'<rect x="'+X0+'" y="'+(cyc-chh/2)+'" width="'+CW+'" height="'+chh+'" rx="18" fill="url(#'+id+')"/>'+txt(cl,X0+CW/2,cyc,'middle','mt c',18)+nodes+'</svg>';
  return out;
}

async function vtLoadCfg(){
  if(VT.cfg!==undefined||VT.cfgBusy||!db)return;
  VT.cfgBusy=true;
  try{var sn=await db.doc('config/boveda').get();VT.cfg=sn.exists?sn.data():null}
  catch(e){VT.cfg=undefined;toast('No se pudo leer la configuración de contraseñas')}
  VT.cfgBusy=false;if(tab==='boveda')paint();
}
async function vtDecryptAll(){
  if(!VT.key)return;var changed=false;
  for(var i=0;i<S.boveda.length;i++){
    var r=S.boveda[i],sig=r.data&&r.data.ct;
    if(!sig||VT.dec[r.id]===sig)continue;
    try{VT.plain[r.id]=await vtDec(VT.key,r.data)}catch(e){VT.plain[r.id]={_err:true}}
    VT.dec[r.id]=sig;changed=true;
  }
  if(changed&&tab==='boveda'&&!VT.modal)paint();
}
var vtGroups=function(){
  var q=norm(VT.q||''),g={};
  S.boveda.forEach(function(r){
    var p=VT.plain[r.id]||{};
    var hay=norm([r.servicio,empName(r.emp||''),p.url,p.usuario,p.notas].join(' '));
    if(q&&hay.indexOf(q)<0)return;
    var k=r.emp||'';(g[k]=g[k]||[]).push(r);
  });
  return g;
};

  var sh=!!VT.shown[r.id];
  var url=p.url?(/^https?:\/\//i.test(p.url)?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+esc(p.url.replace(/^https?:\/\//i,''))+'</a>':esc(p.url)):'';
  return '<article class="card"><h3 style="margin-bottom:4px">'+esc(r.servicio)+'</h3>'+
    (url?'<p class="sub" style="margin:0 0 8px;word-break:break-all">'+url+'</p>':'')+

    '<p style="margin:4px 0"><span class="chip">Clave</span> <span style="font-family:var(--mono);word-break:break-all">'+(sh?esc(p.clave||''):'••••••••••••')+'</span> <button class="lnk" data-act="vtshow" data-id="'+esc(r.id)+'">'+(sh?'Ocultar':'Mostrar')+'</button><button class="lnk" data-act="vtcopy" data-id="'+esc(r.id)+'" data-f="clave">Copiar</button></p>'+
    (p.notas?'<p class="sub" style="white-space:pre-wrap;margin-top:8px">'+esc(p.notas)+'</p>':'')+
    '<p class="sub" style="margin-top:8px">'+esc([r.by?'cargó '+byName(r.by):'',r.ts?new Date(r.ts).toLocaleDateString('es-AR'):''].filter(Boolean).join(' · '))+'</p>'+
    '<div class="acts"><button class="lnk" data-act="vtedit" data-id="'+esc(r.id)+'">Editar</button><button class="lnk bad" data-act="vtdel" data-id="'+esc(r.id)+'">'+(VT.armed===r.id?'¿Seguro?':'Borrar')+'</button></div></article>';
}
function vtListHTML(){
  var g=vtGroups(),keys=Object.keys(g);
  if(!S.boveda.length)return empty('Todavía no hay contraseñas guardadas','Cargá la primera con el botón de arriba: el usuario, la clave y la página de cada servicio que usen en sus aplicaciones (hosting, base de datos, stores, redes, dominios).');
  if(!keys.length)return empty('Sin resultados','Probá con otra búsqueda.');
  keys.sort(function(a,b){return norm(empName(a)).localeCompare(norm(empName(b)))});
  return keys.map(function(k){return '<h3 style="font-size:17px;margin:18px 0 8px">'+esc(k?empName(k):'General de '+(CFG.empresa||'la empresa'))+'</h3><div class="grid">'+g[k].sort(function(a,b){return norm(a.servicio).localeCompare(norm(b.servicio))}).map(vtCard).join('')+'</div>'}).join('');
}
function vBoveda(){
  var head='<div class="card"><h3>Contraseñas de máxima seguridad</h3><p class="sub">Acá guardan las claves y las páginas de todos los servicios de sus aplicaciones. Usuario, clave, página y notas se <strong>cifran en este dispositivo</strong> con una clave maestra que solo conocen ustedes dos: Supabase guarda únicamente texto ilegible y nadie más puede leerlas, ni siquiera quien administre la nube.</p>';
  if(!vtOK())return head+'<p class="note warn">Este navegador no permite el cifrado seguro. Abrí la libreta desde Chrome, Safari o la app instalada.</p></div>';
  if(!db)return head+'</div>';
  if(!COLS.every(ready))return loadingHTML();
  if(VT.cfg===undefined){vtLoadCfg();return head+'<p class="sub">Verificando…</p></div>'}
  if(VT.cfg===null){
    return head+'<p class="sub">Primero elijan la <strong>clave maestra</strong>. Tiene que ser larga (una frase de varias palabras es lo mejor) y la tienen que saber los dos. <strong>Si se pierde, no hay forma de recuperar las contraseñas</strong>: ni nosotros ni Supabase podemos abrirlas. Anótenla en papel y guárdenla en un lugar seguro.</p>'+
      '<form class="vtf" id="vt-setup" autocomplete="off"><div class="fld"><label for="vt-p1">Clave maestra (mínimo 12 caracteres)</label><input id="vt-p1" type="password" autocomplete="new-password" minlength="12" required></div><div class="fld"><label for="vt-p2">Repetirla</label><input id="vt-p2" type="password" autocomplete="new-password" minlength="12" required></div><div class="frow"><button class="btn" type="submit">Crear clave maestra</button></div></form></div>';
  }
  if(!VT.key){
    return head+'<form class="vtf" id="vt-unlock" autocomplete="off"><div class="fld"><label for="vt-pw">Clave maestra</label><input id="vt-pw" type="password" autocomplete="off" required></div><div class="frow"><button class="btn" type="submit">Desbloquear</button></div></form></div>';
  }
  vtDecryptAll();
  var top='<div class="frow" style="margin-top:12px">'+(readOnly?'':'<button class="btn" data-act="vtnew">+ Nueva contraseña</button>')+'<button class="btn ghost" data-act="vtlock">Bloquear ahora</button></div><div class="fld" style="margin-top:12px"><label for="vt-q">Buscar</label><input id="vt-q" type="search" placeholder="Servicio, aplicación, usuario…" value="'+esc(VT.q)+'"></div>';
  return head+top+'</div><div id="vt-list">'+vtListHTML()+'</div>';
}
function vtCloseModal(){if(VT.modal){VT.modal.remove();VT.modal=null}}
function vtGen(){
  var A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*-_=+',n=22,out='',u=new Uint32Array(n),lim=Math.floor(4294967296/A.length)*A.length;
  while(out.length<n){crypto.getRandomValues(u);for(var i=0;i<n&&out.length<n;i++){if(u[i]<lim)out+=A[u[i]%A.length]}}
  return out;
}
function vtOpenModal(id){
  vtCloseModal();
  var r=id?find('boveda',id):null,p=r?(VT.plain[id]||{}):{};
  if(id&&(!r||p._err))return;
  var m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;z-index:300;background:rgba(10,10,20,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px';
  var opts=EMPOPT().map(function(o){return '<option value="'+esc(o[0])+'"'+(((r&&r.emp)||'')===o[0]?' selected':'')+'>'+esc(o[0]===''?'General (todas / la empresa)':o[1])+'</option>'}).join('');
  m.innerHTML='<form class="card vtf" style="width:min(520px,100%);margin:auto" autocomplete="off"><h3>'+(r?'Editar contraseña':'Nueva contraseña')+'</h3>'+
    '<div class="fld"><label>Aplicación</label><select id="vm-emp">'+opts+'</select></div>'+
    '<div class="fld"><label>Servicio o página</label><input id="vm-serv" required maxlength="80" placeholder="Ej: Supabase, GitHub, Google Play Console, dominio" value="'+esc(r?r.servicio:'')+'"></div>'+
    '<div class="fld"><label>Dirección web (opcional)</label><input id="vm-url" type="url" inputmode="url" placeholder="https://" value="'+esc(p.url||'')+'"></div>'+
    '<div class="fld"><label>Usuario o mail</label><input id="vm-user" autocomplete="off" autocapitalize="off" value="'+esc(p.usuario||'')+'"></div>'+
    '<div class="fld"><label>Clave</label><input id="vm-pass" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-family:var(--mono)" value="'+esc(p.clave||'')+'"></div>'+
    '<div class="frow" style="margin-top:6px"><button type="button" class="btn ghost" id="vm-gen">Generar clave segura</button></div>'+
    '<div class="fld"><label>Notas (opcional): preguntas de seguridad, códigos de respaldo, 2FA…</label><textarea id="vm-notas" rows="3" maxlength="2000">'+esc(p.notas||'')+'</textarea></div>'+
    '<div class="frow"><button class="btn" type="submit">Guardar cifrado</button><button class="btn ghost" type="button" id="vm-cancel">Cancelar</button></div></form>';
  document.body.appendChild(m);VT.modal=m;
  m.querySelector('#vm-gen').onclick=function(){m.querySelector('#vm-pass').value=vtGen()};
  m.querySelector('#vm-cancel').onclick=function(){vtCloseModal();paint()};
  m.querySelector('form').onsubmit=async function(ev){
    ev.preventDefault();if(VT.busy||!VT.key)return;VT.busy=true;
    var btn=m.querySelector('button[type=submit]');btn.disabled=true;
    try{
      var emp=m.querySelector('#vm-emp').value,serv=m.querySelector('#vm-serv').value.trim();
      if(!serv){toast('Poné el nombre del servicio');return}
      var payload={url:m.querySelector('#vm-url').value.trim(),usuario:m.querySelector('#vm-user').value.trim(),clave:m.querySelector('#vm-pass').value,notas:m.querySelector('#vm-notas').value.trim()};
      var enc=await vtEnc(VT.key,payload);
      if(r){await db.collection('boveda').doc(r.id).update({emp:emp,servicio:serv,data:enc,ts:Date.now()});delete VT.dec[r.id]}
      else await db.collection('boveda').doc().set({emp:emp,servicio:serv,data:enc,by:myId||null,ts:Date.now()});
      vtCloseModal();toast('Guardada y cifrada');paint();
    }catch(e){toast(saveMsg(e))}
    finally{VT.busy=false;btn.disabled=false}
  };
  setTimeout(function(){var f=m.querySelector('#vm-serv');if(f&&!r)f.focus()},50);
}
document.addEventListener('submit',async function(ev){
  var f=ev.target;
  if(f.id==='vt-setup'){
    ev.preventDefault();if(VT.busy)return;
    var a=$('#vt-p1').value,c=$('#vt-p2').value;
    if(a.length<12){toast('La clave maestra necesita al menos 12 caracteres');return}
    if(a!==c){toast('Las dos claves no coinciden');return}
    VT.busy=true;
    try{
      var cur=await db.doc('config/boveda').get();
      if(cur.exists){VT.cfg=cur.data();toast('Ya existe una clave maestra: ingresala para desbloquear');return}
      var salt=crypto.getRandomValues(new Uint8Array(16)),key=await vtDerive(a,salt,VT_ITER);
      var chk=await vtEnc(key,{ok:'ROAN'});
      var cfg={salt:b64(salt),iter:VT_ITER,check:chk,ts:Date.now()};
      await db.doc('config/boveda').set(cfg);
      VT.cfg=cfg;VT.key=key;vtTouch();toast('Clave maestra creada. Compartísela a tu socio por un medio seguro.');
    }catch(e){toast(saveMsg(e))}
    finally{VT.busy=false;paint()}
  }else if(f.id==='vt-unlock'){
    ev.preventDefault();if(VT.busy)return;
    var pw=$('#vt-pw').value;VT.busy=true;
    try{
      var k=await vtDerive(pw,unb64(VT.cfg.salt),VT.cfg.iter||VT_ITER);
      var o=await vtDec(k,VT.cfg.check);
      if(!o||o.ok!=='ROAN')throw new Error('x');
      VT.key=k;vtTouch();
    }catch(e){toast('Clave maestra incorrecta')}
    finally{VT.busy=false;paint()}
  }
});

  toast(label+' copiado. Se borra del portapapeles en 30 segundos.');
  clearTimeout(vtClipT);vtClipT=setTimeout(function(){try{navigator.clipboard.writeText(' ')}catch(e){}},30000);
}

(async function boot(){
  var C=window.claude;
  try{
    if(C&&C.use){
      db=await C.use('db');user=await C.use('user');downloads=await C.use('downloads');sample=await C.use('sample');
    }
  }catch(e){db=null}
  if(!db){booting=false;renderChrome();renderSync();renderForm();paint();return}
  try{
    var me=await user.me();myId=me&&me.id||null;
    var cw=await user.can('data.write');readOnly=(cw===false);
  }catch(e){}
  var recover=function(){
    COLS.forEach(function(c){
      if(loaded[c])return;
      db.collection(c).get().then(function(snap){
        if(loaded[c])return;
        S[c]=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
        got[c]=true;loaded[c]=true;renderSync();schedule();
      }).catch(function(){});
    });
    [['cfg','config/ajustes'],['ficha','config/ficha']].forEach(function(p){
      if(loaded[p[0]])return;
      db.doc(p[1]).get().then(function(snap){
        if(loaded[p[0]])return;
        if(snap.exists){var o=snap.data();if(p[0]==='cfg')CFG={empresa:o.empresa!=null?o.empresa:'ROAN',a:o.a||'Socio 1',b:o.b||'Socio 2',pctA:o.pctA==null?50:o.pctA,tc:o.tc||0};else FICHA=Object.assign({},FICHA_DEF,o)}
        got[p[0]]=true;loaded[p[0]]=true;renderSync();schedule();
      }).catch(function(){});
    });
  };
  var timer=setTimeout(function(){slow=true;renderSync();recover()},10000);
  var allLoaded=function(){return COLS.every(function(k){return loaded[k]})&&loaded.cfg&&loaded.ficha};
  var onErr=function(k){return function(e){errKeys[k]=(e&&e.code)||'error';if(e&&e.code==='revoked')fatal='Se perdió el acceso a la libreta';slow=true;renderSync()}};
  COLS.forEach(function(c){
    db.collection(c).onSnapshot(function(snap){
      S[c]=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
      got[c]=true;loaded[c]=!snap.metadata.fromCache;
      if(allLoaded())clearTimeout(timer);
      if(c==='emprendimientos'){renderTools();if(!dirty&&!inVozUI())renderForm()}
      schedule();
    },onErr(c));
  });
  db.doc('config/ajustes').onSnapshot(function(snap){
    if(snap.exists){var o=snap.data();CFG={empresa:o.empresa!=null?o.empresa:'ROAN',a:o.a||'Socio 1',b:o.b||'Socio 2',pctA:o.pctA==null?50:o.pctA,tc:o.tc||0}}
    got.cfg=true;loaded.cfg=!snap.metadata.fromCache;
    if(allLoaded())clearTimeout(timer);
    renderTools();if(!dirty&&!inVozUI())renderForm();schedule();
  },onErr('ajustes'));
  db.doc('config/ficha').onSnapshot(function(snap){
    if(snap.exists)FICHA=Object.assign({},FICHA_DEF,snap.data());
    got.ficha=true;loaded.ficha=!snap.metadata.fromCache;
    if(allLoaded())clearTimeout(timer);
    if(!dirty&&!inVozUI())renderForm();schedule();
  },onErr('ficha'));
  booting=false;
  renderChrome();renderForm();renderTools();paint();
})();
})();
